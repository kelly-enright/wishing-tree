<!-- The Wishing Tree mark, same geometry as LogoMark in the app.
     CSS variables cannot reach a favicon, so the palette is written out:
     evergreen #2F5D50, evergreen-deep #22463C, evergreen-soft #4A7A6B,
     gold #E0A84B. A cream rounded square keeps it legible on a dark tab
     strip, where a bare green tree would disappear. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#FBF6EE"/>
  <g transform="translate(0 -0.5)">
    <path d="M16 29v-9" stroke="#22463C" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M16 24c0-2 1.4-3.4 3.2-4" stroke="#22463C" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M15 21c-4.8.6-8-1.6-8.6-5.6-.6-4 1.9-7.2 6.7-7.8 1.6 2.4 2.3 4.6 2.5 6.8.2 2.2-.1 4.4-.6 6.6z" fill="#2F5D50"/>
    <path d="M17 21c4.8.6 8-1.6 8.6-5.6.6-4-1.9-7.2-6.7-7.8-1.6 2.4-2.3 4.6-2.5 6.8-.2 2.2.1 4.4.6 6.6z" fill="#4A7A6B"/>
    <path d="M16 16.5c-2.6-2.4-3.6-5.2-2.8-8.2.8-3 3-5.2 6.2-6.3 1.3 2.9 1.4 5.8.4 8.6-.9 2.4-2.2 4.4-3.8 5.9z" fill="#E0A84B"/>
  </g>
</svg>
