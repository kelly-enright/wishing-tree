[pytest]
testpaths = tests

# The default suite stubs every agent, so it is fast and free. The live tests
# call the real model and are excluded unless you ask for them:
#
#   ./.venv/bin/python -m pytest tests            # fast, stubbed, free
#   ./.venv/bin/python -m pytest -m live          # real gpt-6-luna calls
#
addopts = -m "not live"

markers =
    live: runs against the real gpt-6-luna model and spends tokens
